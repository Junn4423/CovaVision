[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covavision-api"
version = "0.1.0"
description = "FastAPI backend for the independent CovaVision face attendance system"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12,<1.0",
  "prisma>=0.15,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
vision = [
  "numpy>=1.26,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=10.4,<12.0",
  "insightface>=0.7.3,<1.0",
  "onnxruntime>=1.19,<2.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
